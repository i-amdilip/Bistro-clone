<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F284E" />
      <stop offset="100%" stop-color="#091830" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f1e36" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Horizontal Lockup (Primary Header / Presentation) -->
  <g transform="translate(60, 140)">
    <!-- Symbol / Emblem (Left) -->
    <g transform="translate(40, 20)">
      <!-- Outer Shield / Hex-Crest Silhouette -->
      <path d="M120 10 L210 55 C210 145 165 210 120 235 C75 210 30 145 30 55 Z" 
            fill="none" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="6 6" />

      <!-- Topography Hill Line 1 (NER Mountain Silhouette) -->
      <path d="M48 165 C70 145 95 155 120 140 C145 125 170 135 192 165" 
            fill="none" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />

      <!-- Outer Resilient Shield Core -->
      <path d="M120 24 L195 62 C195 136 158 190 120 212 C82 190 45 136 45 62 Z" 
            fill="url(#shieldGrad)" filter="url(#subtleShadow)" />

      <!-- Topographic Ridge & Connected Valley Routes (Layer 1) -->
      <path d="M58 115 Q90 135 120 110 T182 115" 
            fill="none" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

      <!-- Connectivity / Route Path Vector 1 (Green/Teal Route) -->
      <path d="M68 152 C90 120 100 110 120 85 C140 110 150 120 172 152" 
            fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round"/>

      <!-- Central Forward Vector / Dynamic Arrow & Peak -->
      <!-- Dynamic V-Pillar -->
      <path d="M120 48 L168 128 L142 128 L120 86 L98 128 L72 128 Z" 
            fill="#FFFFFF" />

      <!-- Emergency Hazard / Alert Pulse Peak Indicator -->
      <polygon points="120,40 132,60 108,60" fill="url(#accentGrad)" />

      <!-- Network Nodes / Route Junctions -->
      <circle cx="120" cy="86" r="6" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="98" cy="128" r="5" fill="url(#tealGrad)" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="142" cy="128" r="5" fill="url(#tealGrad)" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="120" cy="170" r="7" fill="#38BDF8" stroke="#0F284E" stroke-width="2.5" />

      <!-- Connecting Telemetry Lines -->
      <line x1="98" y1="128" x2="120" y2="170" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <line x1="142" y1="128" x2="120" y2="170" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

      <!-- Coordinate Pulse Ring at Node -->
      <circle cx="120" cy="40" r="14" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />
    </g>

    <!-- Typography Block -->
    <g transform="translate(320, 75)">
      <!-- Main Brand Name -->
      <text x="0" y="70" font-size="78" font-weight="900" fill="#0A192F" letter-spacing="4">
        VECT<tspan fill="#0D9488">O</tspan>R
      </text>

      <!-- Tactical Tagline / Authority Description -->
      <text x="4" y="110" font-size="16" font-weight="700" fill="#0284C7" letter-spacing="3.5">
        NER LOGISTICS &amp; EMERGENCY ROUTE COORDINATION
      </text>

      <!-- SIH Project Reference & Platform Purpose -->
      <text x="4" y="136" font-size="13" font-weight="600" fill="#64748B" letter-spacing="1.5">
        SIH26002 • DISASTER MANAGEMENT &amp; CONNECTIVITY PLATFORM
      </text>

      <!-- Core Credo Pill / Badge -->
      <g transform="translate(4, 155)">
        <rect x="0" y="0" width="370" height="28" rx="6" fill="#F1F5F9" />
        <circle cx="14" cy="14" r="4" fill="#0D9488" />
        <text x="26" y="19" font-size="11" font-weight="700" fill="#334155" letter-spacing="1">
          CONNECTED ROUTES  •  SAFER MOVEMENT  •  FASTER RESPONSE
        </text>
      </g>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="460" x2="920" y2="460" stroke="#F1F5F9" stroke-width="2" />

  <!-- Secondary Format Row: App Icon & Light/Dark Variant Badges -->
  <g transform="translate(80, 480)">
    <!-- App Icon Preview -->
    <g transform="translate(0, 5)">
      <rect x="0" y="0" width="70" height="70" rx="16" fill="url(#shieldGrad)" filter="url(#subtleShadow)" />
      <!-- Mini Vector Symbol -->
      <g transform="translate(11, 10) scale(0.2)">
        <path d="M120 24 L195 62 C195 136 158 190 120 212 C82 190 45 136 45 62 Z" fill="#0F284E" />
        <path d="M68 152 C90 120 100 110 120 85 C140 110 150 120 172 152" fill="none" stroke="#14B8A6" stroke-width="14" stroke-linecap="round"/>
        <path d="M120 48 L168 128 L142 128 L120 86 L98 128 L72 128 Z" fill="#FFFFFF" />
        <polygon points="120,38 134,60 106,60" fill="#EA580C" />
        <circle cx="120" cy="86" r="8" fill="#EA580C" stroke="#FFFFFF" stroke-width="3" />
        <circle cx="120" cy="170" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" />
      </g>
      <text x="85" y="32" font-size="13" font-weight="700" fill="#0F172A">Mobile App Icon</text>
      <text x="85" y="52" font-size="11" font-weight="500" fill="#64748B">Standard 1:1 squircle format for iOS / Android</text>
    </g>

    <!-- Header Compact Lockup Preview -->
    <g transform="translate(480, 5)">
      <rect x="0" y="0" width="360" height="70" rx="12" fill="#0A192F" />
      <!-- Mini White Header Logo -->
      <g transform="translate(18, 14) scale(0.18)">
        <path d="M120 24 L195 62 C195 136 158 190 120 212 C82 190 45 136 45 62 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="6"/>
        <path d="M120 48 L168 128 L142 128 L120 86 L98 128 L72 128 Z" fill="#FFFFFF" />
        <polygon points="120,38 134,60 106,60" fill="#FB923C" />
      </g>
      <text x="70" y="34" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="2">
        VECT<tspan fill="#2DD4BF">O</tspan>R
      </text>
      <text x="70" y="52" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="1.5">
        GOVT DASHBOARD NAVIGATION BAR
      </text>
    </g>
  </g>
</svg>
